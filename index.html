<body class="min-h-screen text-slate-100 flex flex-col justify-between p-4 sm:p-6 selection:bg-emerald-500/30">

  <!-- Üst Boşluk Dengeleyici -->
  <div class="hidden sm:block h-2"></div>

  <!-- Ana İletişim Kartı -->
  <main class="w-full max-w-md mx-auto my-auto">
    <div class="glass-card rounded-3xl p-6 sm:p-7 relative overflow-hidden">

      <!-- Üst Rozet -->
      <div class="flex items-center justify-between mb-5">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800/90 border border-slate-700/70 text-xs font-medium text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 live-dot"></span>
          <span>Hızlı Araç İletişimi</span>
        </div>

        <div class="w-10 h-10 rounded-2xl bg-slate-800/90 border border-slate-700/70 flex items-center justify-center text-slate-200 shadow-inner" aria-hidden="true">
          <!-- Araç İkonu -->
          <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
            <circle cx="7" cy="17" r="2"></circle>
            <path d="M9 17h6"></path>
            <circle cx="17" cy="17" r="2"></circle>
          </svg>
        </div>
      </div>

      <!-- Başlık ve Açıklama -->
      <header class="mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-white mb-2">
          Araç Sahibi ile İletişim
        </h1>
        <p class="text-sm text-slate-300 leading-relaxed">
          Araç sahibine neden ulaşmak istiyorsunuz? Aşağıdan bir neden seçtiğinizde
          <span class="font-semibold text-white whitespace-nowrap">0533 048 13 15</span>
          numarasına hazır mesaj ekranı açılır.
        </p>
      </header>

      <!-- Kanal Seçici (WhatsApp / SMS) -->
      <div class="mb-6">
        <label class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">
          İletişim Yöntemi Seçin
        </label>
        <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-slate-950/75 border border-slate-800/90" role="tablist" aria-label="Mesaj Kanalı">
          <button type="button" id="btnWa" onclick="setChannel('wa')" aria-pressed="true" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 bg-emerald-600 text-white shadow-lg shadow-emerald-950/60">
            <!-- WhatsApp İkonu -->
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span>WhatsApp</span>
          </button>

          <button type="button" id="btnSms" onclick="setChannel('sms')" aria-pressed="false" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200">
            <!-- SMS İkonu -->
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              <line x1="9" y1="9" x2="15" y2="9"></line>
              <line x1="9" y1="13" x2="13" y2="13"></line>
            </svg>
            <span>SMS</span>
          </button>
        </div>
      </div>

      <!-- Seçenek Butonları -->
      <div class="space-y-3">
        <!-- 1. Araç yanlış yerde -->
        <button type="button" onclick="sendReason('Merhaba, aracınız yanlış yerde park edilmiş görünüyor. Müsait olduğunuzda bakabilir misiniz?')" class="reason-btn w-full group flex items-center gap-3.5 p-4 rounded-2xl bg-slate-800/75 hover:bg-slate-800 border border-slate-700/70 hover:border-amber-400/50 text-left">
          <div class="w-11 h-11 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-400 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9 17V7h4a3 3 0 0 1 0 6H9"></path>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm sm:text-base font-semibold text-white group-hover:text-amber-300 transition-colors">
              Araç yanlış yerde
            </div>
            <div class="text-xs text-slate-400 truncate mt-0.5">
              Hatalı park veya geçiş engeli bildirimi
            </div>
          </div>
          <svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 group-hover:translate-x-0.5 transition-all shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <!-- 2. Aracınıza hasar verdim -->
        <button type="button" onclick="sendReason('Merhaba, aracınıza istemeden hasar verdim. İletişime geçebilir miyiz?')" class="reason-btn w-full group flex items-center gap-3.5 p-4 rounded-2xl bg-slate-800/75 hover:bg-slate-800 border border-slate-700/70 hover:border-rose-400/50 text-left">
          <div class="w-11 h-11 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm sm:text-base font-semibold text-white group-hover:text-rose-300 transition-colors">
              Aracınıza hasar verdim
            </div>
            <div class="text-xs text-slate-400 truncate mt-0.5">
              Sürtme, çarpma veya maddi hasar bildirimi
            </div>
          </div>
          <svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 group-hover:translate-x-0.5 transition-all shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <!-- 3. Kişisel meselem var -->
        <button type="button" onclick="sendReason('Merhaba, aracınızla ilgili kişisel bir meselem var, uygun olduğunuzda görüşebilir miyiz?')" class="reason-btn w-full group flex items-center gap-3.5 p-4 rounded-2xl bg-slate-800/75 hover:bg-slate-800 border border-slate-700/70 hover:border-sky-400/50 text-left">
          <div class="w-11 h-11 rounded-xl bg-sky-500/15 border border-sky-500/30 text-sky-400 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm sm:text-base font-semibold text-white group-hover:text-sky-300 transition-colors">
              Kişisel meselem var
            </div>
            <div class="text-xs text-slate-400 truncate mt-0.5">
              Özel bir konuda doğrudan iletişim talebi
            </div>
          </div>
          <svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 group-hover:translate-x-0.5 transition-all shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <!-- 4. Aracınızda bir problem var -->
        <button type="button" onclick="sendReason('Merhaba, aracınızda bir problem fark ettim, bilgi vermek isterim.')" class="reason-btn w-full group flex items-center gap-3.5 p-4 rounded-2xl bg-slate-800/75 hover:bg-slate-800 border border-slate-700/70 hover:border-emerald-400/50 text-left">
          <div class="w-11 h-11 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm sm:text-base font-semibold text-white group-hover:text-emerald-300 transition-colors">
              Aracınızda bir problem var
            </div>
            <div class="text-xs text-slate-400 truncate mt-0.5">
              Açık cam, far, lastik veya teknik uyarı
            </div>
          </div>
          <svg class="w-4 h-4 text-slate-500 group-hover:text-slate-300 group-hover:translate-x-0.5 transition-all shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- Alt Bilgilendirme -->
      <div class="mt-6 pt-4 border-t border-slate-800/90 flex items-center justify-center gap-2 text-xs text-slate-400 text-center">
        <svg class="w-4 h-4 text-slate-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Açılan ekranda hazır mesajı onaylayıp göndermeniz yeterlidir.</span>
      </div>
    </div>
  </main>

  <!-- Toast Bildirim Alanı -->
  <div id="toast" role="status" aria-live="polite" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-200 opacity-0 -translate-y-3">
    <div class="flex items-center gap-2.5 px-4 py-2.5 rounded-full bg-slate-900/95 border border-slate-700 text-white text-sm font-medium shadow-2xl backdrop-blur-md">
      <span id="toastDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
      <span id="toastText">WhatsApp açılıyor...</span>
    </div>
  </div>

  <!-- GitHub Pages Dışa Aktarma Araç Çubuğu (Sadece Önizleme İçin) -->
  

  <!-- Gizli Kopyalama Alanı -->
  

  <script>
    let selectedChannel = 'wa';
    const PHONE_INTL = '905330481315';
    const PHONE_SMS = '+905330481315';
    let toastTimer = null;

    // Web Audio API ile yumuşak tıklama / bildirim sesi
    function playSoftChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(587.33, now); // D5
        osc1.frequency.exponentialRampToValueAtTime(880, now + 0.14); // A5
        osc2.frequency.setValueAtTime(880, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.09, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.25);
        osc2.stop(now + 0.25);
      } catch (err) {
        // Ses engellenirse sessizce devam et
      }
    }

    // Toast bildirimi göster
    function showToast(text, accentColor = 'bg-emerald-400') {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      const toastDot = document.getElementById('toastDot');

      toastText.textContent = text;
      toastDot.className = `w-2.5 h-2.5 rounded-full ${accentColor}`;

      toast.classList.remove('opacity-0', '-translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-3');
      }, 2400);
    }

    // WhatsApp / SMS kanal geçişi
    function setChannel(channel) {
      selectedChannel = channel;
      const btnWa = document.getElementById('btnWa');
      const btnSms = document.getElementById('btnSms');

      if (channel === 'wa') {
        btnWa.setAttribute('aria-pressed', 'true');
        btnSms.setAttribute('aria-pressed', 'false');
        btnWa.className = 'flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 bg-emerald-600 text-white shadow-lg shadow-emerald-950/60';
        btnSms.className = 'flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200';
      } else {
        btnWa.setAttribute('aria-pressed', 'false');
        btnSms.setAttribute('aria-pressed', 'true');
        btnSms.className = 'flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 bg-blue-600 text-white shadow-lg shadow-blue-950/60';
        btnWa.className = 'flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-slate-200';
      }
      playSoftChime();
    }

    // Seçilen mesajla WhatsApp veya SMS uygulamasını aç
    function sendReason(message) {
      playSoftChime();
      const encoded = encodeURIComponent(message);

      if (selectedChannel === 'wa') {
        showToast('WhatsApp açılıyor...', 'bg-emerald-400');
        const waUrl = `https://wa.me/${PHONE_INTL}?text=${encoded}`;
        setTimeout(() => {
          window.location.href = waUrl;
        }, 180);
      } else {
        showToast('SMS uygulaması açılıyor...', 'bg-blue-400');
        const smsUrl = `sms:${PHONE_SMS}?body=${encoded}`;
        setTimeout(() => {
          window.location.href = smsUrl;
        }, 180);
      }
    }

    // GitHub Pages için geliştirici çubuğu olmadan saf index.html üret
    function buildCleanStandaloneHtml() {
      const docClone = document.documentElement.cloneNode(true);
      const footerEl = docClone.querySelector('footer');
      if (footerEl) footerEl.remove();
      const bufferEl = docClone.querySelector('#hiddenCodeBuffer');
      if (bufferEl) bufferEl.remove();

      let htmlString = '<!DOCTYPE html>\n' + docClone.outerHTML;
      // Canlı yayınlanan sayfada doğrudan yönlendirme (window.location.href) kullan
      htmlString = htmlString.replace(
        "window.open(waUrl, '_blank', 'noopener,noreferrer');",
        "window.location.href = waUrl;"
      );
      return htmlString;
    }

    // Dosyayı index.html olarak indir
    function downloadStandaloneHtml() {
      const cleanHtml = buildCleanStandaloneHtml();
      const blob = new Blob([cleanHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      playSoftChime();
      showToast('index.html indirildi!', 'bg-emerald-400');
    }

    // Saf HTML kodunu panoya kopyala
    function copyStandaloneHtml() {
      const cleanHtml = buildCleanStandaloneHtml();
      const buffer = document.getElementById('hiddenCodeBuffer');
      buffer.value = cleanHtml;
      buffer.classList.remove('sr-only');
      buffer.select();
      buffer.setSelectionRange(0, buffer.value.length);

      try {
        document.execCommand('copy');
        const label = document.getElementById('copyBtnLabel');
        label.textContent = 'Kopyalandı!';
        playSoftChime();
        showToast('Kod panoya kopyalandı!', 'bg-sky-400');
        setTimeout(() => {
          label.textContent = 'Kodu Kopyala';
        }, 2200);
      } catch (err) {
        showToast('Kopyalama başarısız oldu.', 'bg-rose-400');
      } finally {
        buffer.classList.add('sr-only');
      }
    }
  </script>

</body></html>
